name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Stage for publishing
        env:
          NPM_TAG: ${{ github.event.release.prerelease == true && 'next' || 'latest' }}
        run: pnpm stage publish --no-git-checks --tag "$NPM_TAG"
